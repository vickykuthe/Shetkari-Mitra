<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"content="width=device-width, initial-scale=1.0">
  <title>Apply for Scheme</title>
  <link rel="icon" href="images/applyicon.png">
  <link rel="stylesheet" href="apply.css">
</head>
<body>
  <div class="container">
    <h2>Apply for a Government Scheme</h2>

    <section>
      <form id="schemeApplicationForm">
        <label for="schemeSelect">Select Scheme:</label>
        <select id="schemeSelect" required>
          <option value="">Loading schemes...</option>
        </select>
        <br /><br />
        <button type="submit">Apply</button>
      </form>
    </section>
    <section>
      <h3>Your Applications</h3>
      <ul id="applicationStatusList"></ul>
    </section>
  </div>
 
</body>
</html>
